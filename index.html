<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) padding keeps controls out of the notch/status-bar area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the toolbar so the status-bar area (and Safari's tinted top bar) blends with the game. -->
    <meta name="theme-color" content="#141921" />
    <!-- Home-screen (standalone) mode on iOS: opaque black status bar; content starts below it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
